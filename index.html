<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">QR STUDIO</p>
      <h1>Crée ton QR code.</h1>
      <p class="subtitle">Transforme un lien ou un texte en QR code en quelques secondes.</p>
    </header>

    <section class="studio">
      <div class="panel editor">
        <label for="content">Contenu</label>
        <textarea id="content" placeholder="https://exemple.com" maxlength="2000"></textarea>

        <div class="fields">
          <div class="field">
            <label for="foreground">Couleur du QR</label>
            <div class="color-row">
              <input id="foreground" type="color" value="#111827">
              <span id="foregroundValue">#111827</span>
            </div>
          </div>

          <div class="field">
            <label for="background">Couleur du fond</label>
            <div class="color-row">
              <input id="background" type="color" value="#ffffff">
              <span id="backgroundValue">#FFFFFF</span>
            </div>
          </div>

          <div class="field full">
            <label for="size">Taille</label>
            <select id="size">
              <option value="180">180 × 180</option>
              <option value="240" selected>240 × 240</option>
              <option value="300">300 × 300</option>
              <option value="400">400 × 400</option>
            </select>
          </div>
        </div>

        <button id="download" class="primary" type="button" disabled>Télécharger le QR</button>
      </div>

      <div class="panel preview-panel">
        <div class="preview-head">
          <span>Aperçu</span>
          <span id="status">En attente</span>
        </div>
        <div class="preview" id="preview">
          <div class="empty">
            <span>QR</span>
            <p>Entre un texte ou un lien pour générer ton QR code.</p>
          </div>
        </div>
        <button id="copy" class="secondary" type="button" disabled>Copier l'image</button>
      </div>
    </section>

    <footer>QR Studio · Simple, rapide, local</footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
